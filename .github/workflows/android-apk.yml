name: Android APK Build & Hermes Bytecode Verification

on:
  push:
    branches:
      - oncobrief-patient-app
      - main
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tools/verify-android-build.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tools/verify-android-build.sh'

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project from app.json
        run: pnpm --filter @oncobrief/mobile exec expo prebuild --platform android --no-install

      - name: Run Build Verification Script
        run: bash tools/verify-android-build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oncobrief-patient-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
