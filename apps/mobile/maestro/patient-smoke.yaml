appId: org.oncobrief.patient
---
# 1. Assert landing or home screen
- extendedWaitUntil:
    visible: ".*(Explore your care|Your care, connected.|One step at a time).*"
    timeout: 10000

# 2. Complete onboarding if on landing screen
- runFlow:
    when:
      visible: "Explore your care"
    commands:
      - tapOn: "Explore your care"
      - extendedWaitUntil:
          visible: ".*(A space to make sense|Open my demo workspace).*"
          timeout: 8000
      - tapOn: "Open my demo workspace"

# 3. Verify Home Screen loaded with oncology cohort
- extendedWaitUntil:
    visible: ".*(Meenakshi Sundaram|Your care, connected.|Stage IIA).*"
    timeout: 10000

# 4. Verify Records Tab (Tab 2, ~30% width, 94% height)
- tapOn:
    point: "30%,94%"
- extendedWaitUntil:
    visible: ".*(Medical records|Search reports|Laboratory).*"
    timeout: 8000

# 5. Verify Journey Tab (Tab 3, ~50% width, 94% height)
- tapOn:
    point: "50%,94%"
- extendedWaitUntil:
    visible: ".*(Care journey|chronological view|evidence ledger).*"
    timeout: 8000

# 6. Verify Insights Tab (Tab 4, ~70% width, 94% height)
- tapOn:
    point: "70%,94%"
- extendedWaitUntil:
    visible: ".*(Care insights|Lab history|Wellbeing).*"
    timeout: 8000

# 7. Verify You / Profile Tab (Tab 5, ~90% width, 94% height)
- tapOn:
    point: "90%,94%"
- extendedWaitUntil:
    visible: ".*(Your profile|Language|தமிழ்).*"
    timeout: 8000

# 8. Test Tamil Language Switch
- tapOn: "தமிழ்"
- extendedWaitUntil:
    visible: ".*(உங்கள் விவரங்களும்|மொழி|அசைவுகளைக் குறை).*"
    timeout: 8000

# 9. Switch back to English
- tapOn: "English"
- extendedWaitUntil:
    visible: ".*(Your profile|Language|English).*"
    timeout: 8000

# 10. Return to Home Tab (Tab 1, ~10% width, 94% height)
- tapOn:
    point: "10%,94%"
- extendedWaitUntil:
    visible: ".*(Your care, connected.|Meenakshi Sundaram).*"
    timeout: 8000
