services:
  postgres:
    image: postgres:16-alpine
    container_name: oncobrief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oncobrief
    ports:
      - "5432:5432"
    volumes:
      - oncobrief-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oncobrief"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional. The default STORAGE_DRIVER is `fs` (see ADR 0013); start this with
  # `docker compose --profile s3 up -d` and set STORAGE_DRIVER=s3 to use it.
  minio:
    image: minio/minio:latest
    container_name: oncobrief-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oncobrief
      MINIO_ROOT_PASSWORD: oncobrief-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - oncobrief-miniodata:/data

  # Optional AWS emulation for the async pipeline (ADR 0015). Start with
  # `docker compose --profile aws up -d`, then:
  #   AWS_ENDPOINT_URL=http://localhost:4566 QUEUE_DRIVER=sqs STORAGE_DRIVER=s3
  #   STORAGE_S3_ENDPOINT=http://localhost:4566 pnpm dev:worker
  # LocalStack is a large image; keep it off the default profile on small disks.
  localstack:
    image: localstack/localstack:3
    container_name: oncobrief-localstack
    profiles: ["aws"]
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs,sns,textract
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - oncobrief-localstack:/var/lib/localstack

volumes:
  oncobrief-pgdata:
  oncobrief-miniodata:
  oncobrief-localstack:
